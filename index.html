<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f6f1" />
<title>Interactive Floor Plan</title>
<style>
:root{--blue:#273b87;--green:#4a9c34;--orange:#f28c18;--red:#c51f27;--ink:#171717;--paper:#fbfbf8;--line:#d8d8d2;--muted:#666;--toolbar:rgba(255,255,255,.96)}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:#e9e8e3;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button,input{font:inherit}.shell{width:min(1700px,100%);margin:0 auto;background:var(--paper);min-height:100%;box-shadow:0 0 30px rgba(0,0,0,.09);display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #c9c9c4;background:var(--toolbar);position:sticky;top:0;z-index:20;flex-wrap:wrap;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}.toolbar-title{font-weight:900;letter-spacing:.06em;font-size:15px}.subtitle{font-size:12px;color:var(--muted)}
.control,.tool-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;padding:8px 12px;border:1px solid #d6d6d1;border-radius:10px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.04);font-weight:700;font-size:13px;cursor:pointer;user-select:none}.tool-btn:hover,.control:hover{border-color:#a9a9a2}.tool-btn:active{transform:translateY(1px)}
.switch{position:relative;width:46px;height:25px;flex:0 0 auto}.switch input{position:absolute;opacity:0;pointer-events:none}.slider{position:absolute;inset:0;border-radius:99px;background:#aaa;cursor:pointer;transition:.18s}.slider:before{content:"";position:absolute;width:19px;height:19px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:.18s}.switch input:checked+.slider:before{transform:translateX(21px)}.switch.dimensions input:checked+.slider{background:#1e63db}.switch.walls input:checked+.slider{background:var(--orange)}.switch.doors input:checked+.slider{background:var(--red)}.switch.grid input:checked+.slider{background:#777}.switch.legend-toggle input:checked+.slider{background:#2e7d62}
.plan-stage{position:relative;flex:1;min-height:0;background:#deddd7;overflow:hidden;touch-action:none}.plan-wrap{position:absolute;inset:0;overflow:hidden;cursor:grab}.plan-wrap.dragging{cursor:grabbing}
svg{width:100%;height:100%;display:block;background:linear-gradient(#fff,#fafafa);user-select:none}.grid-minor{fill:none;stroke:#d8dde4;stroke-width:1;opacity:.36}.grid-major{fill:none;stroke:#bbc3ce;stroke-width:1.3;opacity:.42}
.wall{fill:none;stroke-linecap:square;stroke-linejoin:miter}.exterior{stroke:var(--blue);stroke-width:14}.permanent{stroke:var(--green);stroke-width:14}.changeable{stroke:var(--orange);stroke-width:12}.door-line{stroke:var(--red);stroke-width:8;fill:none}.door-arc{stroke:var(--red);stroke-width:5;fill:none}.room-label{font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:.04em;cursor:pointer}.room-underline{stroke:#111;stroke-width:2.5;pointer-events:none}.stair{stroke:#111;stroke-width:2;fill:none}.dimension{stroke:#111;stroke-width:1.8;fill:none}.dimension text,.dim-text{fill:#111;font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-size:24px;font-weight:650;stroke:none}.guide{stroke:#111;stroke-width:1.4}.tick{stroke:#111;stroke-width:2}.small{font-size:20px}.is-hidden{opacity:0!important;pointer-events:none}.layer{transition:opacity .18s ease}#grid-layer{transition:opacity .18s ease}
.room-zone{fill:transparent;stroke:transparent;stroke-width:4;cursor:pointer;transition:.18s}.room-zone:hover{fill:rgba(30,99,219,.06);stroke:rgba(30,99,219,.35)}.room-zone.selected{fill:rgba(30,99,219,.11);stroke:#1e63db;filter:url(#roomGlow)}
.legend-panel{position:absolute;left:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:11px 16px;max-width:min(760px,calc(100% - 32px));padding:11px 14px;background:rgba(255,255,255,.92);border:1px solid #d3d3cc;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.10);font-size:12px;color:#333;backdrop-filter:blur(8px);transition:.18s}.legend-item{display:flex;align-items:center;gap:7px}.swatch{width:25px;height:7px;border-radius:5px}.room-info{position:absolute;right:16px;bottom:16px;max-width:320px;padding:11px 14px;background:rgba(25,25,25,.88);color:white;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.16);font-size:13px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.18s}.room-info.show{opacity:1;transform:none}
.zoom-dock{position:absolute;right:16px;top:16px;display:grid;grid-template-columns:repeat(2,44px);gap:7px}.zoom-dock .tool-btn{padding:0;min-height:44px;font-size:20px;background:rgba(255,255,255,.94)}.zoom-readout{grid-column:1/-1;text-align:center;background:rgba(255,255,255,.94);border:1px solid #d6d6d1;border-radius:9px;padding:5px;font-weight:800;font-size:12px}
.help{padding:7px 16px;border-top:1px solid #d3d3ce;background:#f6f5f0;color:#686863;font-size:12px;text-align:center}
@media(max-width:900px){.subtitle{display:none}.toolbar{padding:9px}.control,.tool-btn{min-height:40px;padding:7px 10px}.control>span:first-child{font-size:11px}.brand{width:100%;margin:0}.toolbar-title{font-size:14px}.legend-panel{right:16px;bottom:12px}.room-info{left:16px;right:auto;bottom:90px}.help{display:none}}
@media(max-width:560px){.toolbar{gap:6px}.control{flex:1 1 calc(50% - 6px);justify-content:space-between}.toolbar>.tool-btn{flex:1 1 auto}.zoom-dock{top:10px;right:10px}.legend-panel{font-size:11px;gap:8px 10px}.plan-stage{min-height:65vh}}
@media print{body{background:white}.shell{box-shadow:none}.toolbar,.zoom-dock,.help,.room-info{display:none!important}.plan-stage{height:100vh;background:white}.legend-panel{position:fixed;left:12mm;bottom:8mm;box-shadow:none;border:1px solid #aaa}.plan-wrap{position:fixed;inset:0}svg{background:white}}
</style>
</head>
<body>
<div class="shell">
<header class="toolbar" aria-label="Floor plan controls">
  <div class="brand"><div class="toolbar-title">FLOOR PLAN VIEWER</div><div class="subtitle">Tap a room label for details · drag to pan · wheel or pinch to zoom</div></div>
  <label class="control"><span>DIMENSIONS</span><span class="switch dimensions"><input id="toggle-dimensions" type="checkbox" checked><span class="slider"></span></span></label>
  <label class="control"><span>CHANGEABLE WALLS</span><span class="switch walls"><input id="toggle-walls" type="checkbox" checked><span class="slider"></span></span></label>
  <label class="control"><span>DOORS</span><span class="switch doors"><input id="toggle-doors" type="checkbox" checked><span class="slider"></span></span></label>
  <label class="control"><span>GRID</span><span class="switch grid"><input id="toggle-grid" type="checkbox"><span class="slider"></span></span></label>
  <label class="control"><span>LEGEND</span><span class="switch legend-toggle"><input id="toggle-legend" type="checkbox" checked><span class="slider"></span></span></label>

        <line x1="905" y1="355" x2="925" y2="355" class="tick" />

<footer class="help">Keyboard: + / − zoom · 0 reset · G grid · D dimensions · W walls · O doors · L legend · Esc clear room selection</footer>
</div>
<script>
const svg=document.getElementById('floor-plan'), viewport=document.getElementById('viewport'), wrap=document.getElementById('plan-wrap');
const state={scale:1,x:0,y:0,min:.55,max:4,pointers:new Map(),pinchDistance:null,pinchScale:1};
const saved=JSON.parse(localStorage.getItem('floorPlanSettings')||'{}');
function save(){localStorage.setItem('floorPlanSettings',JSON.stringify({dimensions:byId('toggle-dimensions').checked,walls:byId('toggle-walls').checked,doors:byId('toggle-doors').checked,grid:byId('toggle-grid').checked,legend:byId('toggle-legend').checked}))}
function byId(id){return document.getElementById(id)}
function bindToggle(id,target){const c=byId(id),el=byId(target);if(saved[id.replace('toggle-','')]!==undefined)c.checked=saved[id.replace('toggle-','')];const update=()=>{el.classList.toggle('is-hidden',!c.checked);save()};c.addEventListener('change',update);update()}
bindToggle('toggle-dimensions','dimensions-layer');bindToggle('toggle-walls','changeable-layer');bindToggle('toggle-doors','doors-layer');bindToggle('toggle-grid','grid-layer');bindToggle('toggle-legend','legend-panel');
['dimensions-layer','changeable-layer','doors-layer'].forEach(id=>byId(id)?.classList.add('layer'));
function apply(){viewport.setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.scale})`);byId('zoom-readout').textContent=Math.round(state.scale*100)+'%'}
function zoomAt(factor,cx=800,cy=520){const next=Math.max(state.min,Math.min(state.max,state.scale*factor));const ratio=next/state.scale;state.x=cx-(cx-state.x)*ratio;state.y=cy-(cy-state.y)*ratio;state.scale=next;apply()}
function reset(){state.scale=1;state.x=0;state.y=0;apply()}
byId('zoom-in').onclick=()=>zoomAt(1.2);byId('zoom-out').onclick=()=>zoomAt(1/1.2);byId('reset-view').onclick=reset;byId('print-plan').onclick=()=>window.print();
function svgPoint(clientX,clientY){const pt=svg.createSVGPoint();pt.x=clientX;pt.y=clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
wrap.addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});wrap.classList.add('dragging')});
wrap.addEventListener('pointermove',e=>{if(!state.pointers.has(e.pointerId))return;const old=state.pointers.get(e.pointerId);state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.pointers.size===1){const rect=svg.getBoundingClientRect();state.x+=(e.clientX-old.x)*1600/rect.width;state.y+=(e.clientY-old.y)*1040/rect.height;apply()}else if(state.pointers.size===2){const pts=[...state.pointers.values()];const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(state.pinchDistance){const midx=(pts[0].x+pts[1].x)/2,midy=(pts[0].y+pts[1].y)/2,p=svgPoint(midx,midy);zoomAt(d/state.pinchDistance,p.x,p.y)}state.pinchDistance=d}});
function endPointer(e){state.pointers.delete(e.pointerId);if(state.pointers.size<2)state.pinchDistance=null;if(!state.pointers.size)wrap.classList.remove('dragging')}
wrap.addEventListener('pointerup',endPointer);wrap.addEventListener('pointercancel',endPointer);
const rooms=[
{name:'Utility',x:180,y:300,w:405,h:435,note:'Utility room · shown width 108″.'},
{name:'Stairs',x:180,y:735,w:320,h:100,note:'Stair section · shown width 66″.'},
{name:'Closet',x:585,y:355,w:145,h:295,note:'Closet area · shown 54.5″ wide and 65″ deep.'},
{name:'Niche',x:585,y:650,w:145,h:85,note:'Niche · shown depth 24″.'},
{name:'Hallway',x:500,y:735,w:305,h:100,note:'Hallway · shown width 36″.'},
{name:'Bedroom',x:730,y:355,w:700,h:480,note:'Bedroom · shown depth 132″.'}
];
const NS='http://www.w3.org/2000/svg',info=byId('room-info');rooms.forEach(r=>{const rect=document.createElementNS(NS,'rect');rect.setAttribute('x',r.x);rect.setAttribute('y',r.y);rect.setAttribute('width',r.w);rect.setAttribute('height',r.h);rect.setAttribute('class','room-zone');rect.setAttribute('aria-label',r.name);rect.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.room-zone').forEach(z=>z.classList.remove('selected'));rect.classList.add('selected');info.textContent=r.note;info.classList.add('show')});viewport.insertBefore(rect,viewport.firstChild)});
svg.addEventListener('click',()=>{document.querySelectorAll('.room-zone').forEach(z=>z.classList.remove('selected'));info.classList.remove('show')});
document.querySelectorAll('.room-label').forEach(label=>label.addEventListener('click',e=>{e.stopPropagation();const room=rooms.find(r=>r.name.toUpperCase()===label.textContent.trim().toUpperCase());if(room){const zone=[...document.querySelectorAll('.room-zone')].find(z=>z.getAttribute('aria-label')===room.name);zone.dispatchEvent(new Event('click',{bubbles:true}))}}));
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(k==='+'||k==='=')zoomAt(1.2);else if(k==='-')zoomAt(1/1.2);else if(k==='0')reset();else if(k==='g')byId('toggle-grid').click();else if(k==='d')byId('toggle-dimensions').click();else if(k==='w')byId('toggle-walls').click();else if(k==='o')byId('toggle-doors').click();else if(k==='l')byId('toggle-legend').click();else if(k==='escape')svg.dispatchEvent(new Event('click'))});
apply();
</script>
</body></html>
